<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset = "UTF-8">
    <title> Start Stop Fun</title>
    </head>
    <body>
        <button id = "Start1">Start1</button>

         <script>
const ctx = new AudioContext();

//make oscillator
const osc1 = new OscillatorNode(ctx);
osc1.frequency.value = 55;
osc1.type = "sawtooth";

const osc1Gain = new GainNode(ctx);
osc1Gain.gain.value = 0.1;

//make filter

const filter = new BiquadFilterNode(ctx);
filter.type = "lowpass";
filter.frequency.value = 6000;
filter.Q.value = 20;

//make LFO which changes filter cutoff

const mod = new OscillatorNode(ctx);
mod.frequency.value = 1;
mod.type = "sine";

const modGain = new GainNode(ctx);
modGain.gain.value = 4000;

mod.connect(modGain);
modGain.connect(filter.frequency);

osc1.connect(osc1Gain);
osc1Gain.connect(filter)
filter.connect(ctx.destination);

osc1.start();
mod.start();





             </script>
    
    </body>
</html>
